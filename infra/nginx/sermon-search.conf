# Upstream: Next.js web app container.
upstream app {
    server app:3000;
}

# Upstream: Admin Next.js container.
upstream admin {
    server admin:3000;
}

# ---------------------------------------------------------------------------
# Public site — :443
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # -------------------------------------------------------------------------
    # Root-level and static routes — proxied WITHOUT X-Church-Slug.
    # The landing page and legal pages must never receive a church header.
    # -------------------------------------------------------------------------

    location = / {
        proxy_pass         http://app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Church-Slug     "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location = /about {
        proxy_pass         http://app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Church-Slug     "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location = /privacy {
        proxy_pass         http://app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Church-Slug     "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location = /terms {
        proxy_pass         http://app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Church-Slug     "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Next.js internal asset prefix — never church-scoped.
    location /_next/ {
        proxy_pass         http://app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Church-Slug     "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # Church-prefix routing — /<church>/... injects X-Church-Slug.
    #
    # Regex requires at least one [a-z0-9-] character so bare "/" never matches
    # and falls through to the exact-match locations above.
    #
    # proxy_pass does NOT strip the prefix: Next.js reads params.church from the
    # [church] dynamic segment and the API cross-checks it against X-Church-Slug.
    # -------------------------------------------------------------------------

    location ~ ^/(?<church>[a-z0-9-]+)(/.*)?$ {
        proxy_pass         http://app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Church-Slug     $church;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# ---------------------------------------------------------------------------
# Admin panel — :8443
#
# Same TLS cert as :443 (SAN-ready if a separate admin hostname is added later).
# No church-slug routing — the admin app owns its entire path space (/,
# /requests, /churches, etc.) independently of the public site.
# ---------------------------------------------------------------------------

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    location / {
        proxy_pass         http://admin;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
