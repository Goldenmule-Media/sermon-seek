# Upstream: Next.js app container.
# Override APP_HOST / APP_PORT via environment substitution (envsubst) or edit directly.
upstream app {
    server app:3000;
}

# Common proxy headers — include this via map/snippet or paste into each location.
# Defined once here for reference; individual locations below set them explicitly.

# ---------------------------------------------------------------------------
# Root-level and static routes — proxied WITHOUT X-Church-Slug.
# The landing page and legal pages must never receive a church header.
# ---------------------------------------------------------------------------

location = / {
    proxy_pass         http://app;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   X-Church-Slug     "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}

location = /about {
    proxy_pass         http://app;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
