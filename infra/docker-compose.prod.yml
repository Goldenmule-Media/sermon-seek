services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /opt/sermon-search/data/pgdata:/var/lib/postgresql/data
      - /opt/sermon-search/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://sermonseek.ai}
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CACHE_DIR: /var/lib/sermon-search/cache
    volumes:
      - /opt/sermon-search/data/cache:/var/lib/sermon-search/cache
    depends_on:
      postgres:
        condition: service_healthy
    # No cron yet (C24). Container stays up so operators can exec into it.
    # Use `docker compose exec` (not `docker compose run`) to invoke worker
    # commands — `run` would spawn a new container that ignores this override
    # and immediately run the worker entry-point instead of tailing. Example:
    #   docker compose exec worker pnpm worker:run --channel @JubileeChurchSTL
    command: ["tail", "-f", "/dev/null"]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://sermonseek.ai}
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-sermonseek.ai}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/sermon-search/caddy/data:/data
      - /opt/sermon-search/caddy/config:/config
    depends_on:
      - api
      - web
